<!doctype html>
<!-- The Open Graph image, 1200x630. Rendered to public/og.png by `npm run og`.
     The avatar is the peach TikTok profile render (scripts/og-avatar.png). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;700&display=block" rel="stylesheet" />
    <style>
      * { margin: 0; box-sizing: border-box; }
      body {
        width: 1200px; height: 630px; overflow: hidden;
        background: linear-gradient(180deg, #fff1e4 0%, #fde0d5 100%);
        color: #0b2a4a; font-family: "Figtree", system-ui, sans-serif;
        display: flex; align-items: center;
      }
      img { width: 600px; height: 600px; margin: 0 -10px 0 20px; flex: none;
        -webkit-mask-image: radial-gradient(closest-side, #000 88%, transparent); }
      .words { padding-right: 70px; }
      .mark { font-size: 150px; font-weight: 700; letter-spacing: -0.035em; line-height: 1; }
      .line { margin-top: 22px; font-size: 44px; font-weight: 500; line-height: 1.15; }
      .by { margin-top: 30px; font-size: 26px; font-weight: 500; color: #4b6078; }
    </style>
  </head>
  <body>
    <img src="og-avatar.png" alt="" />
    <div class="words">
      <div class="mark">Boop</div>
      <div class="line">A little desk pet that watches your AI agents.</div>
      <div class="by">adoptaboop.com · Mellow Machines Lab</div>
    </div>
  </body>
</html>
